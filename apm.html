<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;min-height:100vh;color:#1e293b}
.shell{max-width:760px;margin:0 auto;padding:24px 16px 60px}
.header{display:flex;align-items:center;gap:14px;padding:20px 0 24px}
.logo-wrap{display:flex;align-items:center;gap:14px}
.divider{width:1px;height:36px;background:#e2e8f0}
.brand{font-weight:700;font-size:15px;color:#1e293b;line-height:1.3}
.brand-sub{font-size:11px;color:#94a3b8;font-weight:500}
.banner{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:12px 16px;font-size:12px;color:#1e40af;margin-bottom:20px;line-height:1.5}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.controls select,.controls input{padding:7px 12px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;color:#1e293b;background:#fff;outline:none}
.controls label{font-size:13px;color:#64748b;display:flex;align-items:center;gap:6px;cursor:pointer}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px 20px;margin-bottom:14px}
.row-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.c-icon{width:34px;height:34px;background:#f1f5f9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.c-name{font-size:13px;font-weight:700;color:#1e293b}
.c-sub{font-size:12px;color:#64748b;margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-timesheet{background:#f0f9ff;color:#0369a1}
.badge-expense{background:#fdf4ff;color:#86198f}
.badge-adm-done{background:#ede9fe;color:#5b21b6}
.badge-adm-pending{background:#fef3c7;color:#92400e}
.links-row{display:flex;gap:14px;margin:8px 0 4px;flex-wrap:wrap}
.links-row a{color:#3b82f6;font-size:12px;text-decoration:none;font-weight:600}
.adm-note-box{background:#f5f3ff;border:1px solid #ddd6fe;border-radius:8px;padding:10px 12px;font-size:12px;color:#4c1d95;margin-top:8px}
.adm-note-box .lbl{font-weight:700;font-size:11px;color:#5b21b6;margin-bottom:3px}
.empty{text-align:center;padding:40px 20px;color:#94a3b8;font-size:13px}
.count-pill{background:#f1f5f9;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;color:#64748b;margin-left:6px}
</style>

function getToken() {
  var params = new URLSearchParams(window.location.search);
  return params.get('token') || '';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
}

function Header(p){
  return h('div',{className:'header'},
    h('div',{className:'logo-wrap'},
      LOGO_B64
        ? h('img',{src:'data:image/jpeg;base64,'+LOGO_B64, style:{height:42,objectFit:'contain'}})
        : h('div',{style:{fontWeight:800,fontSize:18,color:'#1e40af'}},'FD'),
      h('div',{className:'divider'}),
      h('div',null,
        h('div',{className:'brand'},'AP Manager Portal'),
        h('div',{className:'brand-sub'}, p.apmName ? 'Welcome, '+p.apmName : 'Fast Dolphin')
      )
    )
  );
}

function admStatusBadge(inv){
  if (!inv.admStatus) return h('span',{className:'badge badge-adm-pending'},'⏳ Pending ADM review');
  if (inv.admStatus === 'Acknowledged') return h('span',{className:'badge badge-adm-done'},'✓ ADM acknowledged');
  if (inv.admStatus === 'Soft Approved') return h('span',{className:'badge badge-adm-done',style:{background:'#dcfce7',color:'#166534'}},'👍 ADM soft-approved');
  if (inv.admStatus === 'Soft Rejected') return h('span',{className:'badge',style:{background:'#fef2f2',color:'#991b1b'}},'👎 ADM soft-rejected');
  return null;
}

function SubmissionCard(p){
  var inv = p.inv;
  var isExp = inv.submissionType === 'expense';

  return h('div',{className:'card'},
    h('div',{className:'row-top'},
      h('div',{style:{display:'flex',gap:10}},
        h('div',{className:'c-icon'}, isExp ? '💳' : '📋'),
        h('div',null,
          h('div',{className:'c-name'}, inv.consultantName||'—'),
          h('div',{className:'c-sub'},
            (isExp ? 'Expense Report' : 'Timesheet')
            + ' · '
            + (inv.periodFrom ? fmtDate(inv.periodFrom) : '—')
            + ' – '
            + (inv.periodTo ? fmtDate(inv.periodTo) : '—')
          ),
          h('div',{style:{fontSize:11,color:'#94a3b8',marginTop:2}}, 'Submitted ' + fmtDate(inv.submittedOn))
        )
      ),
      h('div',{style:{textAlign:'right',display:'flex',flexDirection:'column',gap:6,alignItems:'flex-end'}},
        isExp
          ? h('span',{className:'badge badge-expense'},'Expense Report')
          : h('span',{className:'badge badge-timesheet'},'Timesheet'),
        admStatusBadge(inv)
      )
    ),

    (inv.fileUrl || (inv.timesheetUrls&&inv.timesheetUrls.filter(Boolean).length>0)) && h('div',{className:'links-row'},
      inv.fileUrl && h('a',{href:inv.fileUrl,target:'_blank'},'📎 View file'),
      (inv.timesheetUrls||[]).filter(Boolean).map(function(url,ti){
        return h('a',{key:ti,href:url,target:'_blank'}, (isExp?'💳 Receipt':'📋 Timesheet')+(inv.timesheetUrls.filter(Boolean).length>1?' '+(ti+1):''));
      })
    ),

    inv.admStatus && h('div',{className:'adm-note-box',
      style:inv.admStatus==='Soft Rejected'?{background:'#fef2f2',border:'1px solid #fecaca'}:
            inv.admStatus==='Soft Approved'?{background:'#f0fdf4',border:'1px solid #bbf7d0'}:{}},
      h('div',{className:'lbl',style:{
        color:inv.admStatus==='Soft Rejected'?'#991b1b':
              inv.admStatus==='Soft Approved'?'#166534':'#5b21b6'
      }},
        (inv.admStatus==='Acknowledged'?'✓ Acknowledged':
         inv.admStatus==='Soft Approved'?'👍 Soft approved':
         '👎 Soft rejected')
        + (inv.admReviewedBy ? ' by ' + inv.admReviewedBy : '')
        + (inv.admReviewedOn ? ' · ' + fmtDate(inv.admReviewedOn) : '')
      ),
      inv.admNote && h('div',{style:{
        marginTop:3,
        color:inv.admStatus==='Soft Rejected'?'#991b1b':
              inv.admStatus==='Soft Approved'?'#166534':'#4c1d95'
      }}, inv.admNote)
    )
  );
}

function ApmPortal(){
  var token = getToken();
  var apmS = useState(null); var apm = apmS[0]; var setApm = apmS[1];
  var errorS = useState(''); var error = errorS[0]; var setError = errorS[1];
  var invoicesS = useState([]); var invoices = invoicesS[0]; var setInvoices = invoicesS[1];
  var loadingS = useState(true); var loading = loadingS[0]; var setLoading = loadingS[1];
  var typeS = useState('all'); var typeFilter = typeS[0]; var setTypeFilter = typeS[1];
  var consultantS = useState('all'); var consultantFilter = consultantS[0]; var setConsultantFilter = consultantS[1];
  var attentionS = useState(false); var attentionOnly = attentionS[0]; var setAttentionOnly = attentionS[1];

  useEffect(function(){
    if (!token) { setError('No token found in the link. Please use your assigned portal link.'); setLoading(false); return; }
    fetch(APPS_SCRIPT_URL + '?action=getApm&token=' + encodeURIComponent(token))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) { setError('Invalid or expired link. Please contact the admin.'); setLoading(false); return; }
        setApm(d);
        return fetch(APPS_SCRIPT_URL + '?action=getApmQueue&token=' + encodeURIComponent(token) + '&_=' + Date.now());
      })
      .then(function(r){ return r && r.json(); })
      .then(function(d){
        if (d && d.invoices) setInvoices(d.invoices);
        setLoading(false);
      })
      .catch(function(){ setError('Could not load data. Please try again.'); setLoading(false); });
  }, []);

  if (loading) return h('div',{className:'shell'},h('div',{className:'empty'},'Loading…'));
  if (error)   return h('div',{className:'shell'},h('div',{className:'empty',style:{color:'#dc2626'}}, error));

  var consultants = Array.from(new Set(invoices.map(function(i){return i.consultantName;}))).sort();

  var displayed = invoices.filter(function(inv){
    var matchType = typeFilter==='all' || inv.submissionType===typeFilter;
    var matchConsultant = consultantFilter==='all' || inv.consultantName===consultantFilter;
    var matchAttention = !attentionOnly || !inv.admStatus;
    return matchType && matchConsultant && matchAttention;
  });

  var tsCount  = invoices.filter(function(i){return i.submissionType==='timesheet';}).length;
  var expCount = invoices.filter(function(i){return i.submissionType==='expense';}).length;

  return h('div',{className:'shell'},
    h(Header, {apmName: apm ? apm.name : ''}),
    h('div',{className:'banner'},
      'Read-only view — all consultant timesheets and expense reports across every Admin Manager. '
      + 'Use the filters below to narrow by type or consultant.'
    ),
    h('div',{className:'controls'},
      h('select',{value:typeFilter,onChange:function(e){setTypeFilter(e.target.value);}},
        h('option',{value:'all'},'All types ('+invoices.length+')'),
        h('option',{value:'timesheet'},'Timesheets ('+tsCount+')'),
        h('option',{value:'expense'},'Expense Reports ('+expCount+')')
      ),
      h('select',{value:consultantFilter,onChange:function(e){setConsultantFilter(e.target.value);}},
        h('option',{value:'all'},'All consultants'),
        consultants.map(function(c){return h('option',{key:c,value:c},c);})
      ),
      h('label',null,
        h('input',{type:'checkbox',checked:attentionOnly,onChange:function(e){setAttentionOnly(e.target.checked);}}),
        'Needs ADM review'
      )
    ),
    displayed.length === 0
      ? h('div',{className:'empty'}, attentionOnly ? 'Nothing pending ADM review.' : 'No submissions found.')
      : displayed.map(function(inv){
          return h(SubmissionCard, {key:inv.rowIndex, inv:inv});
        })
  );
}

ReactDOM.render(h(ApmPortal), document.getElementById('root'));
</script>
