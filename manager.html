<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Fast Dolphin — Manager Activity</title>
<script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#f8fafc;min-height:100vh;color:#1e293b}
.shell{max-width:980px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:20px;margin:8px 0 2px}
.sub{font-size:12px;color:#94a3b8;margin-bottom:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid #e2e8f0;background:#fff;color:#374151;font-family:inherit}
.btn.on{background:#1e293b;color:#fff;border-color:#1e293b}
input[type=date]{border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;font-size:12px;font-family:inherit}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}
.name{font-size:15px;font-weight:700}
.meta{font-size:11px;color:#94a3b8;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.k{background:#f8fafc;border-radius:8px;padding:10px}
.kn{font-size:18px;font-weight:700}
.kl{font-size:11px;color:#64748b;margin-top:2px}
.warn{color:#b45309}.bad{color:#dc2626}.ok{color:#166534}
.note{font-size:12px;color:#64748b;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 12px;margin-bottom:14px}
.center{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px}
.tabs{display:flex;gap:6px;margin:6px 0 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #f1f5f9}
.row:first-child{border-top:none}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.pill.on{background:#dcfce7;color:#166534}.pill.off{background:#f1f5f9;color:#64748b}
.inp{border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;flex:1;min-width:150px}
.linkbox{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:10px 12px;margin-top:10px;font-size:12px;word-break:break-all;color:#166534}
.danger{color:#991b1b;border-color:#fca5a5}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}
.stage{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;cursor:pointer}
.stage.sel{border-color:#1e293b;box-shadow:0 0 0 1px #1e293b}
.stage b{font-size:20px;display:block}.stage span{font-size:11px;color:#64748b}
.stage.warn b{color:#b45309}.stage.bad b{color:#dc2626}.stage.ok b{color:#166534}
.tw{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;color:#94a3b8;text-align:left;padding:9px 12px;border-bottom:1px solid #e2e8f0;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td{padding:10px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;font-size:13px}
tr.trow{cursor:pointer}tr.trow:hover{background:#f8fafc}tr.dim{opacity:.55}
.sub2{font-size:11px;color:#94a3b8;margin-top:2px}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
.c-wait{background:#fef3c7;color:#92400e}.c-flag{background:#fee2e2;color:#991b1b}.c-ok{background:#dcfce7;color:#166534}
.c-ap{background:#dbeafe;color:#1e40af}.c-paid{background:#e0e7ff;color:#3730a3}.c-gray{background:#f1f5f9;color:#64748b}.c-ack{background:#ede9fe;color:#5b21b6}
.days{font-weight:700}.days.late{color:#dc2626}.days.mid{color:#b45309}
.detail td{background:#f8fafc;padding:14px 18px}
.tl{border-left:2px solid #e2e8f0;margin-left:6px;padding-left:14px}
.tl div{margin-bottom:8px;position:relative;font-size:12px}
.tl div:before{content:'';position:absolute;left:-19px;top:5px;width:8px;height:8px;border-radius:50%;background:#94a3b8}
.files a{color:#3b82f6;font-weight:600;text-decoration:none;margin-right:12px;font-size:12px}
.viewbanner{background:#1e293b;color:#fff;border-radius:10px;padding:10px 14px;font-size:12px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="root"></div>
<script>
var h=React.createElement, useState=React.useState, useEffect=React.useEffect;
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0X3EVOqiufWHB7mbZtqYPL9tZR94iC6PLp-S1NEoOZC1oeEIclOoe76DjtM4RZACY/exec';

function iso(d){return d.toISOString().slice(0,10);}
function fmtHrs(x){ if(x==null) return '—'; if(x<48) return Math.round(x*10)/10+' h'; return Math.round(x/24*10)/10+' d'; }
function fmtDT(s){ return s?s.replace('T',' '):'never'; }

function fetchWithRetry(url,n,delay){
  n=n||3; delay=delay||1500;
  return fetch(url).catch(function(err){
    if(n<=1) throw err;
    return new Promise(function(r){setTimeout(r,delay);}).then(function(){return fetchWithRetry(url,n-1,delay*1.5);});
  });
}

function Kpi(p){ return h('div',{className:'k'},h('div',{className:'kn '+(p.cls||'')},p.v),h('div',{className:'kl'},p.l)); }

function ActivityView(p){
  var token=p.token;
  var dS=useState(30); var days=dS[0], setDays=dS[1];
  var fS=useState(''); var from=fS[0], setFrom=fS[1];
  var tS=useState(''); var to=tS[0], setTo=tS[1];
  var dataS=useState(null); var data=dataS[0], setData=dataS[1];
  var errS=useState(''); var err=errS[0], setErr=errS[1];
  var loadS=useState(true); var loading=loadS[0], setLoading=loadS[1];

  function load(){
    var f,t;
    if(days==='custom'){ f=from; t=to; }
    else { var e=new Date(), s=new Date(Date.now()-days*86400000); f=iso(s); t=iso(e); }
    setLoading(true); setErr('');
    fetchWithRetry(APPS_SCRIPT_URL+'?action=getManagerActivity&token='+encodeURIComponent(token)+'&from='+f+'&to='+t+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){ if(d.error){setErr(d.error==='invalid_token'?'This link is not valid.':'Something went wrong.');} else setData(d); setLoading(false); })
      .catch(function(){ setErr('Could not reach the server. Please reload.'); setLoading(false); });
  }
  useEffect(function(){ if(!token){setErr('This link is not valid.');setLoading(false);return;} if(days!=='custom') load(); },[days]);

  if(err && !data) return h('div',{className:'center'},err);
  return h('div',null,
    h('div',{className:'sub'},data?('Showing '+data.from+' → '+data.to):''),
    h('div',{className:'bar'},
      [7,30,90].map(function(n){return h('button',{key:n,className:'btn'+(days===n?' on':''),onClick:function(){setDays(n);}},'Last '+n+' days');}),
      h('button',{className:'btn'+(days==='custom'?' on':''),onClick:function(){setDays('custom');}},'Custom'),
      days==='custom'&&[
        h('input',{key:'f',type:'date',value:from,onChange:function(e){setFrom(e.target.value);}}),
        h('input',{key:'t',type:'date',value:to,onChange:function(e){setTo(e.target.value);}}),
        h('button',{key:'go',className:'btn',onClick:load},'Apply')
      ]
    ),
    err&&h('div',{className:'note'},err),
    data&&data.trackingSince&&h('div',{className:'note'},'Visit counts started on '+data.trackingSince+'. Earlier days show no visits because they weren’t recorded yet. Response times and handled counts use the full history.'),
    data&&!data.trackingSince&&h('div',{className:'note'},'Visit tracking has just started, so visit counts will fill in as managers open their portal.'),
    loading&&!data?h('div',{className:'center'},'Loading…'):null,
    data&&data.managers.map(function(m){
      return h('div',{className:'card',key:m.name},
        h('div',{className:'name'},m.name),
        h('div',{className:'meta'},m.email+' · '+m.consultants+' consultant'+(m.consultants===1?'':'s')+' · last visit: '+fmtDT(m.lastVisit)),
        h('div',{className:'grid'},
          Kpi({v:m.visits,l:'Visits'}),
          Kpi({v:m.daysActive,l:'Days active'}),
          Kpi({v:m.actions,l:'Actions taken'}),
          Kpi({v:fmtHrs(m.medianResponseHrs),l:'Median response ('+m.responded+' items)',cls:m.medianResponseHrs>72?'warn':''}),
          Kpi({v:fmtHrs(m.avgResponseHrs),l:'Average response'}),
          Kpi({v:m.pendingNow,l:'Waiting now',cls:m.pendingNow>0?'warn':'ok'}),
          Kpi({v:m.pendingNow?m.oldestPendingDays+' d':'—',l:'Oldest waiting',cls:m.oldestPendingDays>5?'bad':''}),
          Kpi({v:m.submitted,l:'Items submitted to them'}),
          Kpi({v:m.handled,l:'Handled'}),
          Kpi({v:m.approved+' / '+m.flagged+' / '+m.acknowledged,l:'Approved / flagged / ack.'}),
          Kpi({v:m.resent,l:'Fixed & resent'})
        )
      );
    }),
    data&&h('div',{className:'sub',style:{marginTop:10}},'Response time = from when the consultant submitted to the ADM’s first action, counted in calendar hours (weekends included).')
  );
}
function post(body){
  return fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(body)}).then(function(r){return r.json();});
}

function LinksView(p){
  var token=p.token;
  var dS=useState(null); var data=dS[0], setData=dS[1];
  var eS=useState(''); var err=eS[0], setErr=eS[1];
  var bS=useState(false); var busy=bS[0], setBusy=bS[1];
  var nS=useState(''); var newAdm=nS[0], setNewAdm=nS[1];
  var neS=useState(''); var newAdmEmail=neS[0], setNewAdmEmail=neS[1];
  var cmS=useState(''); var cAdm=cmS[0], setCAdm=cmS[1];
  var cnS=useState(''); var cName=cnS[0], setCName=cnS[1];
  var ceS=useState(''); var cEmail=ceS[0], setCEmail=ceS[1];
  var csS=useState('full'); var cScope=csS[0], setCScope=csS[1];
  var rS=useState(''); var result=rS[0], setResult=rS[1];
  var tS=useState(''); var toast=tS[0], setToast=tS[1];

  function flash(m){ setToast(m); setTimeout(function(){setToast('');},2500); }
  function load(){
    fetchWithRetry(APPS_SCRIPT_URL+'?action=getDirectorLinks&token='+encodeURIComponent(token)+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){ if(d.error) setErr('Could not load links.'); else { setData(d); setErr(''); } })
      .catch(function(){ setErr('Could not reach the server. Please reload.'); });
  }
  useEffect(load,[]);

  function copy(t){ try{ navigator.clipboard.writeText(t).then(function(){flash('Copied');}); }catch(e){ window.prompt('Copy this link:',t); } }
  function run(fn,okMsg){
    setBusy(true); setErr('');
    fn().then(function(d){
      setBusy(false);
      if(d.error){ setErr(d.error==='not_authorized'?'Not authorized — check your link.':(d.error==='adm_not_found'?'That ADM is not active.':'Something went wrong: '+d.error)); }
      else { if(okMsg) flash(okMsg); load(); }
      return d;
    }).catch(function(){ setBusy(false); setErr('Network error — please try again.'); });
  }
  function regen(role,row){
    if(!window.confirm('Regenerate '+row.name+'’s link? Their current link will stop working immediately.')) return;
    var body = role==='ADM' ? {action:'generateAdmToken',directorToken:token,admName:row.name,admEmail:row.email,regenerate:true}
                            : {action:'generateApmToken',directorToken:token,apmName:row.name,apmEmail:row.email,regenerate:true};
    run(function(){return post(body);},'New link created');
  }
  function toggle(role,row){
    if(row.active && !window.confirm('Deactivate '+row.name+'’s link? It will stop working until you reactivate it.')) return;
    run(function(){return post({action:'directorSetTokenActive',directorToken:token,role:role,token:row.token,active:!row.active});},row.active?'Deactivated':'Activated');
  }
  function addAdm(){
    if(!newAdm.trim()||!newAdmEmail.trim()){ setErr('Enter the ADM’s name and email.'); return; }
    run(function(){return post({action:'generateAdmToken',directorToken:token,admName:newAdm.trim(),admEmail:newAdmEmail.trim()});},'ADM link created');
    setNewAdm(''); setNewAdmEmail('');
  }
  function createConsultant(){
    if(!cAdm||!cName.trim()){ setErr('Choose an ADM and enter the consultant’s name.'); return; }
    setResult('');
    run(function(){ return post({action:'directorCreateConsultant',directorToken:token,admName:cAdm,name:cName.trim(),email:cEmail.trim(),scope:cScope}).then(function(d){ if(d.portalLink){ setResult(d.portalLink); setCName(''); setCEmail(''); } return d; }); },'Consultant link created');
  }

  function list(role,rows){
    return rows.map(function(r){
      return h('div',{className:'row',key:r.token},
        h('div',null,
          h('div',{className:'name',style:{fontSize:13}},r.name+' ',h('span',{className:'pill '+(r.active?'on':'off')},r.active?'Active':'Inactive')),
          h('div',{className:'meta'},r.email+(role==='ADM'?' · '+r.consultants+' consultant'+(r.consultants===1?'':'s'):'')+(r.createdOn?' · created '+r.createdOn:''))
        ),
        h('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},
          h('button',{className:'btn',disabled:busy||!r.active,onClick:function(){copy(r.link);}},'Copy link'),
          h('button',{className:'btn',disabled:busy,onClick:function(){regen(role,r);}},'Regenerate'),
          h('button',{className:'btn'+(r.active?' danger':''),disabled:busy,onClick:function(){toggle(role,r);}},r.active?'Deactivate':'Activate')
        )
      );
    });
  }

  if(!data) return h('div',{className:'center'},err||'Loading…');
  var activeAdms=data.adms.filter(function(a){return a.active;});
  return h('div',null,
    err&&h('div',{className:'note'},err),
    toast&&h('div',{className:'note',style:{background:'#f0fdf4',borderColor:'#bbf7d0',color:'#166534'}},toast),
    h('div',{className:'card'},
      h('div',{className:'name'},'Admin managers (ADM)'),
      h('div',{className:'meta',style:{marginBottom:6}},'Each ADM’s standing portal link.'),
      list('ADM',data.adms),
      h('div',{className:'row',style:{justifyContent:'flex-start'}},
        h('input',{className:'inp',placeholder:'New ADM name (exactly as on their consultants’ records)',value:newAdm,onChange:function(e){setNewAdm(e.target.value);}}),
        h('input',{className:'inp',placeholder:'Email',value:newAdmEmail,onChange:function(e){setNewAdmEmail(e.target.value);}}),
        h('button',{className:'btn on',disabled:busy,onClick:addAdm},'Add ADM')
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'name'},'AP manager (APM)'),
      h('div',{className:'meta',style:{marginBottom:6}},'Timesheet and expense portal link.'),
      data.apms.length?list('APM',data.apms):h('div',{className:'meta'},'No APM link yet.')
    ),
    h('div',{className:'card'},
      h('div',{className:'name'},'Create a consultant link for an ADM'),
      h('div',{className:'meta',style:{marginBottom:10}},'Use when an ADM is away. The consultant is assigned to the ADM you choose, and the sheet records that you created it.'),
      h('div',{className:'bar'},
        h('select',{className:'inp',value:cAdm,onChange:function(e){setCAdm(e.target.value);}},
          h('option',{value:''},'Choose ADM…'),
          activeAdms.map(function(a){return h('option',{key:a.token,value:a.name},a.name);})
        ),
        h('input',{className:'inp',placeholder:'Consultant name',value:cName,onChange:function(e){setCName(e.target.value);}}),
        h('input',{className:'inp',placeholder:'Email (optional)',value:cEmail,onChange:function(e){setCEmail(e.target.value);}}),
        h('select',{className:'inp',value:cScope,onChange:function(e){setCScope(e.target.value);}},
          h('option',{value:'full'},'Full access'),
          h('option',{value:'invoice'},'Invoices + My Info'),
          h('option',{value:'partner'},'Partner Portal'),
          h('option',{value:'tsexp'},'Timesheets & Expenses only')
        ),
        h('button',{className:'btn on',disabled:busy,onClick:createConsultant},'Create link')
      ),
      result&&h('div',null,h('div',{className:'linkbox'},result),h('button',{className:'btn',style:{marginTop:8},onClick:function(){copy(result);}},'Copy link'))
    )
  );
}


var STAGES=[['all','All items',''],['waiting_adm','Waiting on ADM','warn'],['flagged','Flagged, waiting on consultant','bad'],['waiting_ap','ADM OK, waiting on AP','warn'],['approved','Approved by AP','ok'],['paid','Paid','ok'],['acknowledged','Acknowledged (timesheets/expenses)',''],['other','Rejected / withdrawn / deleted','']];
function stageOf(it){ return (it.stage==='rejected'||it.stage==='withdrawn'||it.stage==='deleted')?'other':it.stage; }
function fmtAmt(a,c){ if(!a&&a!==0) return '—'; return Number(a).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(c||'USD'); }
function shortD(d){ if(!d) return '—'; return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function typeLabel(t){ return t==='timesheet'?'📋 Timesheet':(t==='expense'?'💳 Expense':'🧾 Invoice'); }
function admChip(it){
  if(it.stage==='withdrawn') return h('span',{className:'chip c-gray'},'Withdrawn by consultant');
  if(it.stage==='deleted') return h('span',{className:'chip c-gray'},'Deleted');
  if(!it.admStatus) return h('span',{className:'chip c-wait'},'Not reviewed');
  var cls=it.admStatus==='Soft Rejected'?'c-flag':(it.admStatus==='Acknowledged'?'c-ack':'c-ok');
  var lbl=it.admStatus==='Soft Rejected'?'Flagged':(it.admStatus==='Soft Approved'?'Soft approved':it.admStatus);
  return h('div',null,h('span',{className:'chip '+cls},lbl),h('div',{className:'sub2'},shortD(it.admOn)+(it.admNote?' · “'+it.admNote.slice(0,40)+(it.admNote.length>40?'…':'')+'”':'')));
}
function apChip(it){
  if(it.type!=='invoice') return h('span',{className:'chip c-gray'},'—');
  if(it.stage==='paid') return h('span',{className:'chip c-paid'},'Paid');
  if(it.stage==='approved') return h('span',{className:'chip c-ok'},'Approved '+shortD(it.apOn));
  if(it.stage==='rejected') return h('span',{className:'chip c-flag'},'Rejected');
  if(it.stage==='waiting_ap') return h('span',{className:'chip c-ap'},'Submitted');
  return h('span',{className:'chip c-gray'},'Pending');
}

function ItemsView(p){
  var token=p.token;
  var dS=useState(30); var days=dS[0], setDays=dS[1];
  var dataS=useState(null); var data=dataS[0], setData=dataS[1];
  var eS=useState(''); var err=eS[0], setErr=eS[1];
  var stS=useState('all'); var stage=stS[0], setStage=stS[1];
  var aS=useState(''); var admF=aS[0], setAdmF=aS[1];
  var tS=useState(''); var typeF=tS[0], setTypeF=tS[1];
  var qS=useState(''); var q=qS[0], setQ=qS[1];
  var xS=useState(null); var open=xS[0], setOpen=xS[1];

  function load(){
    var to=new Date(), from=new Date(Date.now()-days*86400000);
    setErr(''); setData(null);
    fetchWithRetry(APPS_SCRIPT_URL+'?action=getDirectorItems&token='+encodeURIComponent(token)+'&from='+iso(from)+'&to='+iso(to)+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){ if(d.error) setErr('Could not load items.'); else setData(d); })
      .catch(function(){ setErr('Could not reach the server. Please reload.'); });
  }
  useEffect(load,[days]);

  if(p.viewAs) return h(AdmViewer,{token:token,adm:p.viewAs,onBack:function(){p.setViewAs('');}});
  if(!data) return h('div',{className:'center'},err||'Loading…');

  var admNames=[]; data.items.forEach(function(i){ if(admNames.indexOf(i.adm)<0) admNames.push(i.adm); }); admNames.sort();
  var base=data.items.filter(function(i){
    if(admF&&i.adm!==admF) return false;
    if(typeF&&i.type!==typeF) return false;
    if(q){ var s=(i.consultant+' '+(i.invoiceNumber||'')).toLowerCase(); if(s.indexOf(q.toLowerCase())<0) return false; }
    return true;
  });
  var counts={all:base.length}; base.forEach(function(i){ var k=stageOf(i); counts[k]=(counts[k]||0)+1; });
  var shown=stage==='all'?base:base.filter(function(i){return stageOf(i)===stage;});

  return h('div',null,
    h('div',{className:'bar'},
      [7,30,90].map(function(n){return h('button',{key:n,className:'btn'+(days===n?' on':''),onClick:function(){setDays(n);}},'Last '+n+' days');}),
      h('span',{className:'sub',style:{margin:0}},'Items still open are always shown, whatever their date.')
    ),
    h('div',{className:'strip'},STAGES.map(function(s){
      return h('div',{key:s[0],className:'stage '+s[2]+(stage===s[0]?' sel':''),onClick:function(){setStage(s[0]);}},h('b',null,counts[s[0]]||0),h('span',null,s[1]));
    })),
    h('div',{className:'bar'},
      h('select',{className:'inp',style:{flex:'0 1 180px'},value:admF,onChange:function(e){setAdmF(e.target.value);}},h('option',{value:''},'All ADMs'),admNames.map(function(n){return h('option',{key:n,value:n},n);})),
      h('select',{className:'inp',style:{flex:'0 1 150px'},value:typeF,onChange:function(e){setTypeF(e.target.value);}},h('option',{value:''},'All types'),h('option',{value:'invoice'},'Invoices'),h('option',{value:'timesheet'},'Timesheets'),h('option',{value:'expense'},'Expenses')),
      h('input',{className:'inp',placeholder:'Search consultant or invoice #',value:q,onChange:function(e){setQ(e.target.value);}}),
      h('button',{className:'btn on',onClick:function(){p.pickViewAs(admF);}},'👁 View as ADM…')
    ),
    shown.length===0?h('div',{className:'center'},'Nothing here.'):
    h('div',{className:'tw'},h('table',null,
      h('thead',null,h('tr',null,['Consultant','ADM','Type','Amount','Submitted','ADM action','AP status','Waiting'].map(function(c){return h('th',{key:c,style:c==='Amount'?{textAlign:'right'}:null},c);}))),
      h('tbody',null,shown.map(function(it){
        var key=it.id+'|'+it.consultant;
        var dim=it.hidden||it.stage==='withdrawn'||it.stage==='deleted';
        var dcls=it.daysWaiting>=7?'late':(it.daysWaiting>=3?'mid':'');
        var rows=[h('tr',{key:key,className:'trow'+(dim?' dim':''),onClick:function(){setOpen(open===key?null:key);}},
          h('td',null,h('b',null,it.consultant),h('div',{className:'sub2'},it.type==='invoice'?(it.invoiceNumber?'#'+it.invoiceNumber:'—'):(shortD(it.periodFrom)+' – '+shortD(it.periodTo)))),
          h('td',null,it.adm),
          h('td',null,typeLabel(it.type)),
          h('td',{style:{textAlign:'right'}},h('b',null,it.type==='invoice'?fmtAmt(it.amount,it.currency):'—')),
          h('td',null,shortD(it.submittedOn)),
          h('td',null,admChip(it),it.hidden&&h('div',{className:'sub2'},'Hidden by ADM')),
          h('td',null,apChip(it)),
          h('td',null,it.daysWaiting==null?'—':h('span',{className:'days '+dcls},it.daysWaiting+' d'))
        )];
        if(open===key) rows.push(h('tr',{key:key+'d',className:'detail'},h('td',{colSpan:8},
          h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))',gap:20}},
            h('div',null,h('div',{style:{fontWeight:700,marginBottom:8}},'History'),
              h('div',{className:'tl'},it.timeline.map(function(t,i){return h('div',{key:i},h('span',{style:{color:'#94a3b8'}},t.ts+' — '),t.text);}),
                it.daysWaiting!=null&&h('div',null,h('b',null,'Now: '),'waiting '+it.daysWaiting+' day'+(it.daysWaiting===1?'':'s')+(it.stage==='waiting_adm'?' on '+it.adm:(it.stage==='flagged'?' on the consultant':' on AP')))
              ),
              it.stage==='waiting_adm'&&h('div',{className:'sub2',style:{marginTop:6}},it.seenCount>0?(it.adm+' had this in their queue on '+it.seenCount+' visit'+(it.seenCount===1?'':'s')+' (last '+it.lastSeen+').'):(it.adm+' has not opened their portal since this was submitted.'))
            ),
            h('div',null,h('div',{style:{fontWeight:700,marginBottom:8}},'Files'),
              h('div',{className:'files'},it.fileUrl&&h('a',{href:it.fileUrl,target:'_blank'},'📎 '+(it.type==='invoice'?'Invoice':'Document')),it.timesheetUrls.map(function(u,i){return h('a',{key:i,href:u,target:'_blank'},'📋 '+(it.type==='expense'?'Receipt ':'Timesheet ')+(it.timesheetUrls.length>1?(i+1):''));})),
              it.createdBy&&h('div',{className:'sub2',style:{marginTop:12}},'Consultant link created by '+it.createdBy),
              it.linkedId&&h('div',{className:'sub2'},'Payment system ID: '+it.linkedId)
            )
          )
        )));
        return rows;
      }))
    ))
  );
}

function AdmViewer(p){
  var dS=useState(null); var data=dS[0], setData=dS[1];
  var eS=useState(''); var err=eS[0], setErr=eS[1];
  useEffect(function(){
    fetchWithRetry(APPS_SCRIPT_URL+'?action=getDirectorAdmQueue&token='+encodeURIComponent(p.token)+'&adm='+encodeURIComponent(p.adm)+'&_='+Date.now())
      .then(function(r){return r.json();})
      .then(function(d){ if(d.error) setErr(d.error==='adm_not_found'?'That ADM is not active.':'Could not load.'); else setData(d); })
      .catch(function(){ setErr('Could not reach the server.'); });
  },[p.adm]);
  var back=h('button',{className:'btn',onClick:p.onBack},'← Back to items');
  if(err) return h('div',null,back,h('div',{className:'center'},err));
  if(!data) return h('div',null,back,h('div',{className:'center'},'Loading…'));
  var inv=data.invoices;
  var waiting=inv.filter(function(i){return !i.admStatus;}).length;
  var flagged=inv.filter(function(i){return i.admStatus==='Soft Rejected';}).length;
  return h('div',null,
    h('div',{className:'viewbanner'},h('span',null,'👁 Viewing '+data.adm+'’s portal — read-only. Nothing here can be changed, and this isn’t counted as their visit.'),back),
    h('div',{className:'strip'},
      h('div',{className:'stage warn'},h('b',null,waiting),h('span',null,'Waiting for their review')),
      h('div',{className:'stage bad'},h('b',null,flagged),h('span',null,'Flagged')),
      h('div',{className:'stage'},h('b',null,inv.length),h('span',null,'Items in their list'))
    ),
    inv.length===0?h('div',{className:'center'},'Their list is empty.'):
    inv.map(function(i){
      var isTS=i.submissionType==='timesheet'||i.submissionType==='expense';
      return h('div',{className:'card',key:i.id+i.consultantName},
        h('div',{style:{display:'flex',justifyContent:'space-between',gap:10,flexWrap:'wrap'}},
          h('div',null,h('div',{className:'name',style:{fontSize:14}},i.consultantName),
            h('div',{className:'meta'},isTS?((i.submissionType==='expense'?'Expense report · ':'Timesheet · ')+shortD(i.periodFrom)+' – '+shortD(i.periodTo)):((i.documentType==='nf'?'Nota Fiscal ':'Invoice ')+(i.invoiceNumber||'—')+' · submitted '+shortD(i.submittedOn)))),
          h('div',{style:{textAlign:'right'}},!isTS&&h('div',{style:{fontWeight:700}},fmtAmt(i.amount,i.currency)),
            h('span',{className:'chip '+(!i.admStatus?'c-wait':(i.admStatus==='Soft Rejected'?'c-flag':(i.admStatus==='Acknowledged'?'c-ack':'c-ok')))},!i.admStatus?'Needs review':(i.admStatus==='Soft Rejected'?'Flagged':i.admStatus)))
        ),
        i.admNote&&h('div',{className:'meta',style:{marginTop:8}},'Their note: “'+i.admNote+'”'),
        i.replacedOn&&h('div',{className:'meta',style:{color:'#b45309',fontWeight:600}},'🔄 Files replaced '+shortD(i.replacedOn)),
        h('div',{className:'files',style:{marginTop:8}},i.fileUrl&&h('a',{href:i.fileUrl,target:'_blank'},'📎 View'),(i.timesheetUrls||[]).filter(Boolean).map(function(u,k){return h('a',{key:k,href:u,target:'_blank'},'📋 '+(i.submissionType==='expense'?'Receipt':'Timesheet')+' '+(k+1));}))
      );
    }),
    h('div',{className:'card'},h('div',{className:'name'},'Recent logins'),
      data.sessions.length===0?h('div',{className:'meta',style:{marginTop:6}},'No logins recorded yet — tracking starts when this update goes live.'):
      data.sessions.map(function(s,k){
        return h('div',{className:'row',key:k},h('div',null,h('b',null,s.ts),h('div',{className:'meta'},(s.waiting?s.waiting+' in their queue':'')+(s.actions.length?'':(s.waiting?' · ':'')+'no action taken'))),
          h('div',{className:'meta',style:{textAlign:'right'}},s.actions.map(function(a,j){return h('div',{key:j},a);})));
      })
    )
  );
}

function App(){
  var token=new URLSearchParams(window.location.search).get('token');
  var tS=useState('activity'); var tab=tS[0], setTab=tS[1];
  var vS=useState(''); var viewAs=vS[0], setViewAs=vS[1];
  var pS=useState(false); var picking=pS[0], setPicking=pS[1];
  var lS=useState([]); var admList=lS[0], setAdmList=lS[1];
  if(!token) return h('div',{className:'center'},'This link is not valid.');

  function pickViewAs(pre){
    if(pre&&pre!=='(no manager)'){ setViewAs(pre); return; }
    setPicking(true);
    fetchWithRetry(APPS_SCRIPT_URL+'?action=getDirectorLinks&token='+encodeURIComponent(token)+'&_='+Date.now())
      .then(function(r){return r.json();}).then(function(d){ setAdmList((d.adms||[]).filter(function(a){return a.active;})); }).catch(function(){});
  }
  return h('div',{className:'shell'},
    h('h1',null,'Fast Dolphin — Director'),
    h('div',{className:'tabs'},
      h('button',{className:'btn'+(tab==='activity'?' on':''),onClick:function(){setTab('activity');}},'Manager activity'),
      h('button',{className:'btn'+(tab==='items'?' on':''),onClick:function(){setTab('items');}},'Items'),
      h('button',{className:'btn'+(tab==='links'?' on':''),onClick:function(){setTab('links');}},'Links')
    ),
    picking&&h('div',{className:'card'},h('div',{className:'name'},'View as ADM'),
      h('div',{className:'meta',style:{margin:'4px 0 10px'}},'Read-only view of that manager’s portal. Your visit isn’t counted as theirs.'),
      h('div',{className:'bar'},admList.map(function(a){return h('button',{key:a.token,className:'btn',onClick:function(){setPicking(false);setTab('items');setViewAs(a.name);}},a.name);}),
        h('button',{className:'btn',onClick:function(){setPicking(false);}},'Cancel'))),
    tab==='activity'?h(ActivityView,{token:token}):
    tab==='items'?h(ItemsView,{token:token,viewAs:viewAs,setViewAs:setViewAs,pickViewAs:pickViewAs}):
    h(LinksView,{token:token})
  );
}
ReactDOM.render(h(App),document.getElementById('root'));
</script>
</body>
</html>
